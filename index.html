<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0b0b0f" />
        <!-- Describes the site as it is today, not as `site-mode.js` will let
             it be when `AFFILIATES_ONLY` is turned off.

             That distinction is the whole point. The catalogue, the live
             creator rows and the recordings market are all built and all
             currently hidden, and a title promising live broadcasts over a
             page that is a partner directory is a mismatch between the
             snippet and the landing page - which is both what Google demotes
             for and what a visitor bounces from. When the flag flips, this
             block and the `<noscript>` below it change with it. -->
        <title>LustXR — VR Porn and 3D Adult Video, Curated from Top Sites</title>
        <meta
            name="description"
            content="A curated directory of VR porn and 3D adult video from leading partner studios and cam sites, with performer profiles. Free to browse. Paid links. 18+."
        />
        <link rel="canonical" href="https://lustxr.com/" />

        <!-- Tell Google this is an adult site, in the words its own guidelines
             ask for: developers.google.com/search/docs/specialty/explicit.
             Without it, classification is left to automated detection of the
             page's text and images - which on a site whose homepage is mostly
             an empty div until JavaScript runs is a coin toss, and getting it
             wrong in either direction is bad. Classified explicit when it is
             not loses the traffic; classified clean when it is not is the kind
             of mistake that gets a domain handled manually.

             The second tag says the same thing to everyone else. Google treats
             the two as interchangeable and asks for only one, but RTA is what
             parental-control software, device-level filters and several ad
             networks actually read, and none of those know about the first. -->
        <meta name="rating" content="adult" />
        <meta name="rating" content="RTA-5042-1996-1400-1577-RTA" />

        <!-- Indexable and followable, said out loud. The default if this is
             absent is the same thing, so this is documentation rather than
             instruction - but `max-image-preview:large` is not the default,
             and it is what lets a result carry a thumbnail instead of a line
             of grey text. -->
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

        <!-- Link previews. Not a ranking signal, but the thing that decides
             whether a link pasted into a chat window looks like a product or
             like a bare URL - and increasingly what a generative answer quotes
             when it has nothing else to go on. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="LustXR" />
        <meta property="og:title" content="LustXR — VR Porn and 3D Adult Video, Curated from Top Sites" />
        <meta
            property="og:description"
            content="A curated directory of VR porn and 3D adult video from leading partner studios and cam sites, with performer profiles. Paid links. 18+."
        />
        <meta property="og:url" content="https://lustxr.com/" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='19' font-weight='bold' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />

        <!-- JuicyAds site ownership check. Public by the same reasoning as the
             measurement id below: the verifier reads it out of this page's
             source, so it is not a secret and does not belong in `app.env`.

             It is only on this file. Verification fetches the domain root, and
             a copy in `live.html` would be a second place to forget. -->
        <meta name="juicyads-site-verification" content="351d1e66f357b0091150925ff110cf44" />

        <!-- Google Analytics (GA4). The measurement id is not a secret - it is
             visible in the page source of every site that uses one - so it is
             written here rather than threaded through the build as an env var.

             Only the production hosts load the remote tag. `gtag` itself is
             always defined, so calls from anywhere in the app are harmless
             no-ops in development: they queue onto `dataLayer` and nothing
             reaches Google until gtag.js is present to drain it. Without this
             guard every `npm run dev` and every headless test run would file
             real hits against the property. -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                window.dataLayer.push(arguments);
            }
            gtag('js', new Date());
            gtag('config', 'G-HK6Q0JBGTC');

            if (location.hostname === 'lustxr.com' || location.hostname === 'www.lustxr.com') {
                const tag = document.createElement('script');
                tag.async = true;
                tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-HK6Q0JBGTC';
                document.head.appendChild(tag);
            }
        </script>

        <!-- What this site is, in a form something that does not run
             JavaScript can read.

             The reason this is here and not left to the app is specific
             rather than general. Googlebot renders JavaScript and sees the
             real catalogue; almost nothing else does. GPTBot, ClaudeBot,
             PerplexityBot and CCBot fetch the HTML and read it as text, and
             the HTML of a single-page app is four empty divs - so to every
             crawler that feeds a generative answer, this domain currently has
             no content at all and nothing to say about itself.

             Being structured data rather than prose is what makes it legible
             to Google as well. `isFamilyFriendly: false` is the same
             declaration the rating tag makes, in the vocabulary a knowledge
             panel is built from. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "WebSite",
                        "@id": "https://lustxr.com/#website",
                        "url": "https://lustxr.com/",
                        "name": "LustXR",
                        "description": "A curated directory of VR and 3D adult video from partner studios and cam sites, with performer profiles.",
                        "inLanguage": "en",
                        "isFamilyFriendly": false,
                        "publisher": { "@id": "https://lustxr.com/#org" }
                    },
                    {
                        "@type": "Organization",
                        "@id": "https://lustxr.com/#org",
                        "name": "LustXR",
                        "url": "https://lustxr.com/",
                        "description": "LustXR curates VR and stereoscopic 3D adult video from third-party partner sites. It does not produce or host the content it links to.",
                        "email": "contact@lustxr.com",
                        "telephone": "+1-888-383-6767",
                        "contactPoint": {
                            "@type": "ContactPoint",
                            "contactType": "customer support",
                            "email": "contact@lustxr.com",
                            "telephone": "+1-888-383-6767",
                            "availableLanguage": "English"
                        }
                    }
                ]
            }
        </script>
    </head>
    <body>

                <p>

                    <a href="/2257">2257 exemption statement</a> ·

        <!-- Flat playback surface. The <video> element is appended here at boot

        <canvas id="render-canvas"></canvas>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
