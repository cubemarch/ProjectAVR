<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0b0b0f" />
        <title>LustXR</title>
        <meta
            name="description"
            content="Live 2D and 3D broadcasts from creators, watched in a browser or a headset, with private 1:1 sessions and a recordings marketplace."
        />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='19' font-weight='bold' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />

        <!-- JuicyAds site ownership check. Public by the same reasoning as the
             measurement id below: the verifier reads it out of this page's
             source, so it is not a secret and does not belong in `app.env`.

             It is only on this file. Verification fetches the domain root, and
             a copy in `live.html` would be a second place to forget. -->
        <meta name="juicyads-site-verification" content="351d1e66f357b0091150925ff110cf44" />

        <!-- Google Analytics (GA4). The measurement id is not a secret - it is
             visible in the page source of every site that uses one - so it is
             written here rather than threaded through the build as an env var.

             Only the production hosts load the remote tag. `gtag` itself is
             always defined, so calls from anywhere in the app are harmless
             no-ops in development: they queue onto `dataLayer` and nothing
             reaches Google until gtag.js is present to drain it. Without this
             guard every `npm run dev` and every headless test run would file
             real hits against the property. -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                window.dataLayer.push(arguments);
            }
            gtag('js', new Date());
            gtag('config', 'G-HK6Q0JBGTC');

            if (location.hostname === 'lustxr.com' || location.hostname === 'www.lustxr.com') {
                const tag = document.createElement('script');
                tag.async = true;
                tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-HK6Q0JBGTC';
                document.head.appendChild(tag);
            }
        </script>
    </head>
    <body>
        <!-- Browse experience (DOM). -->
        <div id="browse-root"></div>

        <!-- Flat playback surface. The <video> element is appended here at boot
             and is shared with the WebXR renderer. -->
        <div class="player-shell" id="player-shell"></div>

        <!-- Creator Studio. Hidden until a creator opens it. -->
        <div id="portal-root" hidden></div>

        <!-- Profile and credits, for viewers and creators alike. -->
        <div id="profile-root" hidden></div>

        <!-- Immersive playback surface (PlayCanvas). -->
        <canvas id="render-canvas"></canvas>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
