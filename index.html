             Without it, classification is left to automated detection of the
             page's text and images - which on a site whose homepage is mostly
             an empty div until JavaScript runs is a coin toss, and getting it
             wrong in either direction is bad. Classified explicit when it is
             not loses the traffic; classified clean when it is not is the kind
             of mistake that gets a domain handled manually.

             The second tag says the same thing to everyone else. Google treats
             the two as interchangeable and asks for only one, but RTA is what

        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

             image renders as a bare URL in most clients and as a broken
             placeholder in the rest.

             Absolute, because a relative URL is resolved against whatever
             page embedded it and the scrapers that read this are not on this
             domain. 1200x630 is the size Facebook, LinkedIn, Slack, Discord

        <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />

        <!-- JuicyAds site ownership check. Public by the same reasoning as the
             measurement id below: the verifier reads it out of this page's
             source, so it is not a secret and does not belong in `app.env`.

             It is only on this file. Verification fetches the domain root, and
             a copy in `live.html` would be a second place to forget. -->
        <meta name="juicyads-site-verification" content="351d1e66f357b0091150925ff110cf44" />

        <!-- Google Analytics (GA4). The measurement id is not a secret - it is
             visible in the page source of every site that uses one - so it is
             written here rather than threaded through the build as an env var.

             Only the production hosts load the remote tag. `gtag` itself is
             always defined, so calls from anywhere in the app are harmless
             no-ops in development: they queue onto `dataLayer` and nothing
             reaches Google until gtag.js is present to drain it. Without this
             guard every `npm run dev` and every headless test run would file
             real hits against the property. -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                window.dataLayer.push(arguments);
            }
            gtag('js', new Date());
            // Our own browsers. Opening any page once with `?internal=1` marks
            // this browser and `?internal=0` clears it; GA's Internal Traffic
            // data filter drops every hit that carries the mark. It goes by
            // browser rather than IP so it holds on a VPN and on a phone.
            try {
                const internal = new URLSearchParams(location.search).get('internal');
                if (internal === '1' || internal === '0') localStorage.setItem('avr:internal', internal);
                if (localStorage.getItem('avr:internal') === '1') gtag('set', { traffic_type: 'internal' });
            } catch {}
            gtag('config', 'G-HK6Q0JBGTC');

            if (location.hostname === 'lustxr.com' || location.hostname === 'www.lustxr.com') {
                const tag = document.createElement('script');
                tag.async = true;
                tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-HK6Q0JBGTC';
                document.head.appendChild(tag);
            }
        </script>

             JavaScript can read.

             The reason this is here and not left to the app is specific
             rather than general. Googlebot renders JavaScript and sees the
             real catalogue; almost nothing else does. GPTBot, ClaudeBot,
             PerplexityBot and CCBot fetch the HTML and read it as text, and

             Being structured data rather than prose is what makes it legible
             to Google as well. `isFamilyFriendly: false` is the same

        <script type="application/ld+json">

                <h2>The problem this site exists to solve</h2>

                <h2>How VR video is packaged, and why it matters</h2>
                <p>
                    Four properties describe almost every VR or 3D video file. They are
                    independent of one another, which is why &ldquo;VR video&rdquo; on its own
                    tells you almost nothing about whether something will play.
                </p>
                <dl>
                    <dt>Projection: 180&deg; or 360&deg;</dt>
                    <dd>
                        A 180&deg; file covers the hemisphere in front of the viewer. A 360&deg;
                        file covers the whole sphere, so you can turn and look behind you. Most
                        adult VR is 180&deg;, because spending the whole frame on the half of
                        the world anyone is actually looking at buys roughly twice the effective
                        resolution. A 180&deg; file played as though it were 360&deg; appears
                        stretched across too much of the view, and the reverse leaves half the
                        sphere black.
                    </dd>

                    <dt>Stereo layout: side-by-side or over-under</dt>
                    <dd>
                        A stereoscopic file carries two images, one per eye, packed into a
                        single video frame. Side-by-side (SBS) puts them left and right;
                        over-under, also called top-bottom or TB, stacks them. Nothing in the
                        video itself reliably says which, so a player told the wrong one splits
                        the frame along the wrong axis and shows a doubled or squashed picture.
                        This is the single most common reason a correctly downloaded file looks
                        broken.
                    </dd>

                    <dt>Monoscopic or stereoscopic</dt>
                    <dd>
                        A monoscopic file shows one image to both eyes. It still surrounds you
                        and you can still look around, but it is flat &mdash; there is no depth,
                        because both eyes receive exactly the same picture. A stereoscopic file
                        carries a separate image per eye and is what produces the sense of
                        physical presence people mean by VR. Mono files are roughly half the
                        size, which is why they turn up in places where stereo was implied.
                    </dd>

                    <dt>Eye order: left-right or right-left</dt>
                    <dd>
                        Which half of a stereo frame belongs to which eye. Reversed, an image
                        still looks three-dimensional, so it is easy to miss &mdash; but the
                        depth is inverted, near objects read as far, and most people experience
                        it as eye strain or nausea within a few minutes rather than as a visible
                        fault. Left-right is the overwhelming convention.
                    </dd>
                </dl>

                <h2>What this means for a headset</h2>

                    will all play every combination above, provided the playback app is told
                    which combination it has been given. Dedicated VR video players exist
                    precisely because that instruction usually has to be supplied by hand.
                </p>
                <p>

                    rather than projection: a file encoded in HEVC at a resolution above what a
                    particular device will decode in hardware either stutters or refuses to
                    play, and the same title offered at a lower resolution plays cleanly on the
                    same headset. A file that plays on a desktop and fails on a headset is far
                    more often this than a format mismatch.
                </p>
