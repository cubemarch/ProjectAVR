# XcodeGen project definition.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open AVRCapture.xcodeproj
#
# The generated `.xcodeproj` is deliberately not committed. An Xcode project
# file is a merge-hostile blob that records absolute paths and per-machine
# settings, and regenerating it from this file takes a second. See README.md in
# this directory for how to build the same target by hand if you would rather
# not install another tool.

name: AVRCapture

options:
  bundleIdPrefix: com.projectavr
  deploymentTarget:
    # iOS 17 for `onChange(of:_:)`'s two-parameter form and
    # `AVCaptureConnection.videoRotationAngle`. Multi-cam capture itself needs
    # only iOS 13, but it needs A12 hardware, and every A12 device runs 17.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Warnings-as-errors is off: this target has only been built against one
    # SDK version, and turning a deprecation on somebody else's into a build
    # failure would be the first thing they have to undo.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AVRCapture:
    type: application
    platform: iOS

    sources:
      - path: AVRCapture
        excludes:
          # Referenced through INFOPLIST_FILE below. Left in `sources` it would
          # also be copied into the bundle as a stray resource.
          - Info.plist

    # Deliberately no `info:` block. XcodeGen's `info.path` means "*generate* a
    # plist here", and it will happily overwrite a handwritten one with a
    # near-empty default — which silently strips NSCameraUsageDescription and
    # makes the app die the instant it asks for the camera. The checked-in
    # Info.plist is the single source of truth; it is wired up by
    # INFOPLIST_FILE, and GENERATE_INFOPLIST_FILE is NO.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectavr.capture
        PRODUCT_NAME: AVRCapture
        INFOPLIST_FILE: AVRCapture/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"  # iPhone. Multi-cam is not available on iPad.
        CODE_SIGN_STYLE: Automatic

    # Signing lives in Local.xcconfig, which is not committed.
    #
    # `DEVELOPMENT_TEAM` cannot go in this file. It is a per-developer value, and
    # anything set here is regenerated - so a team picked in Xcode's Signing pane
    # is silently wiped the next time anyone runs `xcodegen generate`, and the
    # build starts failing again with no obvious cause. An xcconfig is read at
    # build time and survives regeneration.
    #
    # Copy Local.xcconfig.example to Local.xcconfig and put your team id in it.
    # Capture cannot be tested in the simulator - there are no cameras - so this
    # is not optional.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig

    # No third-party dependencies. Everything used here - AVFoundation,
    # VideoToolbox, Network, SwiftUI - ships with the system, which matters for
    # a binary that has to be trusted with a creator's camera.
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Network.framework
      - sdk: Security.framework

  # Everything testable without a camera: destination validation, the parsing
  # and rejection of imported configuration, log redaction, and the pure policy
  # functions. The capture graph itself needs hardware and is covered by the
  # manual plan in docs/IOS_TESTING.md instead.
  AVRCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AVRCaptureTests
    dependencies:
      - target: AVRCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.projectavr.capture.tests
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig

schemes:
  AVRCapture:
    build:
      targets:
        AVRCapture: all
        AVRCaptureTests: [test]
    test:
      targets:
        - AVRCaptureTests
    run:
      config: Debug
